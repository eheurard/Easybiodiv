[pytest]
DJANGO_SETTINGS_MODULE = easybiodiv.settings

# Volontairement sans `*_test.py` : ce motif ramasse dashboard/services/stress_test.py,
# qui est du code de production, pas des tests.
python_files = tests.py test_*.py tests_*.py

# WhiteNoise avertit a chaque requete que STATIC_ROOT (staticfiles/, gitignore et
# genere par collectstatic) n'existe pas en local. Attendu hors deploiement : on le
# tait ici pour garder la sortie de test lisible, sans masquer d'autres UserWarning.
filterwarnings =
    ignore:No directory at:UserWarning
