{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <script>
    /* Meme logique que le dashboard : theme pose avant le rendu, a partir du
       choix memorise, sinon de la preference systeme. Pas de bascule ici. */
    (function () {
      var t;
      try { t = localStorage.getItem('theme'); } catch (e) { t = null; }
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Easybiodiv{% endblock %}</title>

  <link rel="icon" type="image/svg+xml" href="{% static 'dashboard/img/favicon.svg' %}">
  <link rel="icon" type="image/x-icon" href="{% static 'dashboard/img/favicon.ico' %}">
  <link rel="apple-touch-icon" href="{% static 'dashboard/img/apple-touch-icon.png' %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{% static 'authentication/css/auth.css' %}">

  <style>
    #page-loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fbf9f4;transition:opacity .4s ease,visibility .4s ease}
    #page-loader.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
    #page-loader .pl-ring{width:46px;height:46px;border-radius:50%;border:4px solid #e4e2dd;border-top-color:#91452d;animation:pl-spin .8s linear infinite}
    #page-loader .pl-text{font:500 13px/1 'Inter',system-ui,sans-serif;color:#54433e;letter-spacing:.03em}
    @keyframes pl-spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){#page-loader .pl-ring{animation-duration:1.8s}}
  </style>
</head>
<body>

  <div id="page-loader" role="status" aria-live="polite" aria-label="Chargement en cours">
    <div class="pl-ring" aria-hidden="true"></div>
    <span class="pl-text">Chargement…</span>
  </div>
  <script>
    (function(){function h(){var l=document.getElementById('page-loader');if(l)l.classList.add('is-hidden');}
    if(document.readyState==='complete'){h();}else{window.addEventListener('load',h);setTimeout(h,4000);}
    window.addEventListener('pageshow',function(e){if(e.persisted)h();});})();
  </script>

  <a href="{% url 'dashboard:index' %}" class="auth-brand" aria-label="Retour à l'accueil Easybiodiv">
    <div class="auth-brand__logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
        <path d="M16 6C10.477 6 6 10.477 6 16s4.477 10 10 10 10-4.477 10-10S21.523 6 16 6zm0 3a7 7 0 110 14A7 7 0 0116 9zm0 2a5 5 0 100 10A5 5 0 0016 11zm0 2a3 3 0 110 6 3 3 0 010-6z" fill="#fff"/>
      </svg>
    </div>
    <div class="auth-brand__text">
      <span class="auth-brand__name">Easybiodiv</span>
      <span class="auth-brand__tagline">Biodiversité &amp; CSRD</span>
    </div>
  </a>

  <main class="auth-card">
    {% block card %}{% endblock %}
  </main>

  <a href="{% url 'dashboard:index' %}" class="auth-back" aria-label="Retour au dashboard">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
      <path d="M9 11L5 7l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Retour au dashboard
  </a>

</body>
</html>
